[package]
name = "qs-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Kommandozeilenwerkzeug für Querencia Software: Suche, Details, Aktualisierungen, Simulation, Probeläufe gegen Attrappe und Prüfgerüst"

[[bin]]
name = "qs-cli"
path = "src/main.rs"

[dependencies]
qs_typen = { path = "../../querencia-software-paketkit/qs_typen" }
qs_transaktion = { path = "../qs_transaktion", features = ["glib"] }
glib = "0.22"
futures = "0.3"
# D-Bus-Schicht von SW-1 für --echt (nur lesend) und --pruefgeruest.
# Ohne dieses Feature (--no-default-features) kennt qs-cli nur --attrappe.
qs_paketkit = { path = "../../querencia-software-paketkit", optional = true }

[features]
default = ["paketkit"]
paketkit = ["dep:qs_paketkit"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[dev-dependencies]
glib = "0.22"

[[test]]
name = "pruefgeruest"
required-features = ["paketkit"]
